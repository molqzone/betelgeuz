[package]
name = "betelgeuz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Headless local control core: SSH transport, attach identity, deploy pipeline, strategies, served over JSON-RPC on stdio."

[[bin]]
name = "betelgeuz-core"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
errors = { path = "../errors" }
transport = { path = "../transport" }
strategy = { path = "../strategy" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
transport = { path = "../transport", features = ["test-util"] }
